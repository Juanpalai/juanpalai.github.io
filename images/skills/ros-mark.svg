	<circle cx="57.9" cy="12.9" r="12.9" fill="#eaf0f7" />
	<circle cx="102.9" cy="12.9" r="12.9" fill="#eaf0f7" />
	<circle cx="12.9" cy="57.9" r="12.9" fill="#eaf0f7" />
	<circle cx="57.9" cy="57.9" r="12.9" fill="#eaf0f7" />
	<circle cx="102.9" cy="57.9" r="12.9" fill="#eaf0f7" />
	<circle cx="12.9" cy="102.9" r="12.9" fill="#eaf0f7" />
	<circle cx="57.9" cy="102.9" r="12.9" fill="#eaf0f7" />
	<circle cx="102.9" cy="102.9" r="12.9" fill="#eaf0f7" />
</svg>
